name: 🌙 Nightly snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  MAVEN_ARGS: "-B -ntp"
  JAVA_VERSION: 21

jobs:
  check-job:
    if: github.event.repository.fork == false && github.ref == 'refs/heads/develop'
    permissions:
      actions: read
      contents: read

    name: 🔍 Check changes on develop
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}

    steps:
      - name: 🔍 Compare with last snapshot and check CI status
        id: check
        run: |
          LAST=""
          for ID in $(gh run list -R "$GITHUB_REPOSITORY" -w snapshot.yml -b develop -s success -L 50 --json databaseId -q '.[].databaseId'); do
            if [ -n "$(gh run view "$ID" -R "$GITHUB_REPOSITORY" --json jobs -q '.jobs[] | select(.name == "🚀 Snapshot on develop" and .conclusion == "success") | .name')" ]; then
              LAST=$(gh run view "$ID" -R "$GITHUB_REPOSITORY" --json headSha -q '.headSha')
              break
            fi
          done
          echo "Current: $GITHUB_SHA"
          echo "Last snapshot: ${LAST:-none}"
          if [ "$LAST" = "$GITHUB_SHA" ]; then
            echo "No change since last snapshot" >> $GITHUB_STEP_SUMMARY
            echo "deploy=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          CI=$(gh run list -R "$GITHUB_REPOSITORY" -w java-maven.yml -b develop -c "$GITHUB_SHA" -s success -L 1 --json databaseId -q 'length')
          if [ "$CI" = "0" ]; then
            echo "CI has not succeeded on $GITHUB_SHA" >> $GITHUB_STEP_SUMMARY
            echo "deploy=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Deploying snapshot of $GITHUB_SHA" >> $GITHUB_STEP_SUMMARY
          echo "deploy=true" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snapshot-job:
    needs: check-job
    if: needs.check-job.outputs.deploy == 'true'

    name: 🚀 Snapshot on develop
    runs-on: ubuntu-latest

    steps:
      - name: ⚙️ Checkout and Setup Maven
        uses: s4u/setup-maven-action@v1.22.0
        with:
          checkout-submodules: true
          checkout-fetch-depth: 0
          java-version: ${{ env.JAVA_VERSION }}

      - name: ☕ Deploy snapshot with Maven if settings defined
        run: test ! -f ci.settings.xml || mvn deploy -DskipTests -Dmaven.repository.credentialScope=id -s ci.settings.xml -P base-deploy,snapshot-deploy
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
