name: 🌙 Nightly snapshot

# Deploys the commit pointed by tag ci/tested (moved by java-maven.yml after a successful dry-run on develop)
# unless it was already deployed (tag ci/snapshotted).

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
      timezone: 'Europe/Brussels'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  MAVEN_ARGS: "-B -ntp"
  JAVA_VERSION: 21

jobs:
  check-job:
    if: github.event.repository.fork == false
    permissions:
      contents: read

    name: 🔍 Check for new tested commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}

    steps:
      - name: ⚙️ Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔍 Compare ci/tested with ci/snapshotted
        id: check
        run: |
          TESTED=$(git rev-parse -q --verify 'refs/tags/ci/tested^{commit}' || true)
          SNAPSHOTTED=$(git rev-parse -q --verify 'refs/tags/ci/snapshotted^{commit}' || true)
          if [ -z "$TESTED" ]; then
            echo "::notice title=Snapshot skipped::No ci/tested tag yet"
          elif [ "$TESTED" = "$SNAPSHOTTED" ]; then
            echo "::notice title=Snapshot skipped::Nothing new since last snapshot (${TESTED:0:7})"
          else
            echo "::notice title=Snapshot scheduled::Deploying ${TESTED:0:7}"
            echo "sha=$TESTED" >> "$GITHUB_OUTPUT"
          fi

  snapshot-job:
    needs: check-job
    if: needs.check-job.outputs.sha != ''
    permissions:
      contents: read

    name: 🚀 Snapshot
    runs-on: ubuntu-latest

    steps:
      - name: ⚙️ Checkout and Setup Maven
        uses: s4u/setup-maven-action@v1.22.0
        with:
          checkout-ref: ${{ needs.check-job.outputs.sha }}
          checkout-submodules: true
          checkout-fetch-depth: 0
          java-version: ${{ env.JAVA_VERSION }}

      - name: ☕ Deploy snapshot with Maven if settings defined
        run: test ! -f ci.settings.xml || mvn deploy -DskipTests -Dmaven.repository.credentialScope=id -s ci.settings.xml -P base-deploy,snapshot-deploy
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  mark-snapshotted-job:
    needs: [ check-job, snapshot-job ]
    permissions:
      contents: write

    name: 🏷️ Mark as snapshotted
    runs-on: ubuntu-latest

    steps:
      - name: ⚙️ Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check-job.outputs.sha }}

      - name: 🏷️ Move ci/snapshotted tag
        run: |
          git tag -f ci/snapshotted
          git push -f origin refs/tags/ci/snapshotted
